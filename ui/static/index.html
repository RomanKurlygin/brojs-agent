<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>brojs-agent — панель управления</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <span class="brand-mark">B</span>
        <div>
          <h1>brojs-agent</h1>
          <p class="subtitle">Автоматизация заданий KFU-26-1 · platform.brojs.ru</p>
        </div>
      </div>
      <div class="header-actions">
        <button type="button" class="btn btn-ghost" id="btn-refresh-status">Обновить статус</button>
      </div>
    </header>

    <section class="status-grid" id="status-grid" aria-label="Статус подключений"></section>

    <section class="tools-panel" id="tools-panel" aria-label="Инструменты агента"></section>

    <main class="main-grid">
      <div class="panel workspace">
        <nav class="tabs" role="tablist">
          <button type="button" class="tab active" data-tab="chat" role="tab">Чат с агентом</button>
          <button type="button" class="tab" data-tab="pipeline" role="tab">Пайплайн</button>
        </nav>

        <div class="tab-panel active" id="panel-chat" role="tabpanel">
          <div class="quick-prompts" id="quick-prompts"></div>
          <div class="chat-log" id="chat-log" aria-live="polite"></div>
          <form class="chat-form" id="chat-form">
            <textarea
              id="chat-input"
              rows="2"
              placeholder="Например: покажи список заданий курса KFU-26-1"
              required
            ></textarea>
            <button type="submit" class="btn btn-primary" id="btn-send">Отправить</button>
          </form>
        </div>

        <div class="tab-panel" id="panel-pipeline" role="tabpanel" hidden>
          <p class="panel-desc">
            Пакетный режим: агент возьмёт все задания со статусом <code>todo</code> / <code>in_progress</code>,
            выполнит их и сдаст в журнал. Это может занять много времени и токенов LLM.
          </p>
          <div class="pipeline-actions">
            <button type="button" class="btn btn-primary" id="btn-pipeline-start">Запустить пайплайн</button>
            <span class="pipeline-status" id="pipeline-status">Ожидание</span>
          </div>
          <div class="pipeline-results" id="pipeline-results"></div>
        </div>
      </div>

      <aside class="panel log-panel">
        <div class="log-header">
          <h2>Журнал</h2>
          <button type="button" class="btn btn-ghost btn-sm" id="btn-clear-log">Очистить</button>
        </div>
        <div class="log-stream" id="log-stream" aria-live="polite"></div>
      </aside>
    </main>

    <footer class="footer">
      <span>Курс: <strong id="course-label">—</strong></span>
      <span>·</span>
      <a href="https://smith.langchain.com/studio/?baseUrl=http://127.0.0.1:2024" target="_blank" rel="noopener">LangGraph Studio</a>
    </footer>
  </div>
  <script src="/static/app.js" type="module"></script>
</body>
</html>
